<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PanelStock — Desktop</title>
<meta name="theme-color" content="#0f172a" />
<link rel="icon" href="icon-192.png" />

<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #f8fafc; height: 100%; }
  #root { min-height: 100vh; }
</style>

<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "5d19dd9ae0534c36b7dd2dfcc93970f1"}'></script>
<!-- End Cloudflare Web Analytics -->

<style id="panelstock-entry-layouts">
.ps-entry{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:20px;margin-bottom:20px;color:#0f172a}
.ps-entry h2{font-size:14px;font-weight:600;margin:0 0 8px}.ps-entry-intro{font-size:12px;color:#64748b;margin:0 0 20px}
.ps-entry-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:16px;align-items:start}.ps-catalog-grid{grid-template-columns:1fr 1fr .58fr 2.02fr}
.ps-entry label{display:block;min-width:0;font-size:12px;color:#475569}.ps-entry label>input{margin-top:6px}
.ps-entry input{width:100%;min-width:0;height:42px;padding:10px 12px;border:1px solid #dbe3ef;border-radius:8px;font-size:14px;background:white}
.ps-entry input:focus{outline:2px solid #cce4eb;outline-offset:1px}.ps-entry-rows{min-width:0}.ps-entry-row,.ps-entry-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 30px;gap:16px;align-items:center}
.ps-entry-row{margin-bottom:8px}.ps-entry-columns{font-size:12px;color:#475569;margin-bottom:6px}.ps-entry-columns>span{min-width:0}
.ps-cnc-row{grid-template-columns:minmax(90px,.8fr) minmax(110px,1fr) minmax(160px,1.35fr) 30px}.ps-cnc-row>input:nth-child(3){padding-left:14px;padding-right:14px}
.ps-cnc-single-row{grid-template-columns:minmax(100px,.8fr) minmax(120px,1fr) minmax(180px,1.4fr)}
@media(max-width:540px){.ps-cnc-single-row{grid-template-columns:1fr 1fr}.ps-cnc-single-row>label:last-child{grid-column:1/-1}}
.ps-catalog-row{grid-template-columns:repeat(3,minmax(0,1fr)) 30px;gap:10px}.ps-single-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.ps-entry-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}.ps-entry-primary{background:#155e75;color:white;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600}.ps-entry-primary:disabled{opacity:.4;cursor:not-allowed}.ps-entry-cancel{color:#475569;padding:12px;font-size:14px;font-weight:600}
.ps-entry-add{border:1px solid #155e75;color:#155e75;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;margin-top:8px}.ps-entry-trash{color:#dc2626;width:30px;height:42px;display:grid;place-items:center}.ps-entry-note{font-size:12px;color:#64748b;margin-top:12px}.ps-entry-errors{background:#fef2f2;color:#991b1b;padding:12px;border-radius:8px;margin-top:12px;font-size:13px}
.ps-measure{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center;padding:20px;background:#f0f7f9;border:1px solid #cee1e7;border-radius:12px;margin-bottom:20px}.ps-measure h3{font-size:14px;font-weight:600;margin:0 0 8px}.ps-measure p{font-size:13px;line-height:1.5;color:#475569;margin:5px 0}.ps-measure svg{display:block;width:100%;height:auto;max-height:190px}.ps-measure-compact{gap:12px;padding:14px;margin:16px 0}.ps-measure-compact h3{font-size:13px}.ps-measure-compact p{font-size:12px}
@media(max-width:900px){.ps-entry-grid,.ps-catalog-grid{grid-template-columns:1fr 1fr}.ps-entry-rows{grid-column:1/-1}}
@media(max-width:540px){.ps-entry{padding:16px}.ps-entry-grid,.ps-catalog-grid{grid-template-columns:1fr}.ps-entry-row,.ps-entry-columns{gap:8px}.ps-catalog-row{gap:6px}.ps-catalog-row input{padding:9px 6px;font-size:12px}.ps-entry-columns{font-size:11px}.ps-measure{gap:8px;padding:12px}.ps-measure p{font-size:11px}.ps-measure h3{font-size:12px}}

/* Forms also adapt to the available content width beside desktop navigation. */
.ps-entry{container-type:inline-size}
@container (max-width:820px){.ps-catalog-grid{grid-template-columns:1fr 1fr 1fr}.ps-catalog-grid>.ps-entry-rows{grid-column:1/-1}}
@container (max-width:620px){.ps-entry-grid{grid-template-columns:1fr 1fr}.ps-entry-rows{grid-column:1/-1}}
@container (max-width:440px){.ps-entry-grid,.ps-catalog-grid{grid-template-columns:1fr}.ps-catalog-row input{padding:9px 6px;font-size:12px}.ps-entry-row,.ps-entry-columns{gap:8px}.ps-entry-columns{font-size:11px}}

/* Place catalog guidance between shared material details and size entry. */
.ps-catalog-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.65fr)}
.ps-catalog-grid>.ps-measure,.ps-catalog-grid>.ps-entry-rows{grid-column:1/-1}
.ps-catalog-grid>.ps-measure{margin:0}
.ps-measure{grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:16px}
.ps-measure svg{max-height:220px}
@container (max-width:620px){.ps-catalog-grid{grid-template-columns:1fr 1fr}.ps-catalog-grid>label:last-of-type{grid-column:1/-1}}
@container (max-width:440px){.ps-catalog-grid{grid-template-columns:1fr}.ps-measure{grid-template-columns:1fr}.ps-measure svg{max-height:none}}
@media(max-width:540px){.ps-measure{grid-template-columns:1fr;gap:10px}.ps-measure svg{max-height:none}.ps-measure h3{font-size:13px}.ps-measure p{font-size:12px}}
</style>
