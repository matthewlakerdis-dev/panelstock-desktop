name: Apply Damage SOH sorting
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Damage material picker sorting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_sig='function ItemPicker({ variants, offcuts, selected, onSelect }) {'
          new_sig='function ItemPicker({ variants, offcuts, selected, onSelect, sortLikeSoh = false }) {'
          if old_sig not in s:
              raise SystemExit('ItemPicker signature not found')
          s=s.replace(old_sig,new_sig,1)
          old_items='''    const items = [\n      ...variants.filter((v) => v.qty > 0).map((v) => ({ ...v, itemType: "variant" })),\n      ...offcuts.filter((o) => o.qty > 0).map((o) => ({ ...o, itemType: "offcut" }))\n    ].filter((i) => `${i.color} ${i.material} ${i.thickness} ${i.sku}`.toLowerCase().includes(q.toLowerCase()));'''
          new_items='''    const availableItems = [\n      ...variants.filter((v) => v.qty > 0).map((v) => ({ ...v, itemType: "variant" })),\n      ...offcuts.filter((o) => o.qty > 0).map((o) => ({ ...o, itemType: "offcut" }))\n    ].filter((i) => `${i.color} ${i.material} ${i.thickness} ${i.sku}`.toLowerCase().includes(q.toLowerCase()));\n    const sortSohItems = (items) => groupByMaterialLargestFirst(items).flatMap((g) =>\n      [...g.items].sort((a, b) => a.color.localeCompare(b.color) || b.width * b.height - a.width * a.height)\n    );\n    const items = sortLikeSoh\n      ? [...sortSohItems(availableItems.filter((i) => i.itemType === "variant")), ...sortSohItems(availableItems.filter((i) => i.itemType === "offcut"))]\n      : availableItems;'''
          if old_items not in s:
              raise SystemExit('ItemPicker items block not found')
          s=s.replace(old_items,new_items,1)
          old_damage='(0, import_jsx_runtime.jsx)(ItemPicker, { variants, offcuts, selected, onSelect: setSelected })'
          first=s.find(old_damage)
          second=s.find(old_damage, first+1)
          if second < 0:
              raise SystemExit('Damage ItemPicker call not found')
          s=s[:second]+s[second:].replace(old_damage,'(0, import_jsx_runtime.jsx)(ItemPicker, { variants, offcuts, selected, onSelect: setSelected, sortLikeSoh: true })',1)
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Sort Damage stock like SOH"
          git push
