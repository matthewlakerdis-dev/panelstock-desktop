name: Filter zero-stock full panels from SOH
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hide zero-stock full panel lines
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''    const rows = view === "panels" ? variants : offcuts;'''
          new='''    const inStockVariants = variants.filter((v) => Number(v.qty) > 0);\n    const rows = view === "panels" ? inStockVariants : offcuts;'''
          if old not in s:
              raise SystemExit('StockTab rows source not found')
          s=s.replace(old,new,1)
          old_count='''          variants.length,'''
          new_count='''          inStockVariants.length,'''
          if old_count not in s:
              raise SystemExit('Full panels count source not found')
          s=s.replace(old_count,new_count,1)
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Hide zero-stock full panels from SOH"
          git push
