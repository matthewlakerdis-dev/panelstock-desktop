name: Move CNC trash beside panel title once
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CNC panel card actions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panelstock-client.js')
          s=p.read_text()
          old="if(orderLeaf){orderLeaf.textContent='Panel '+panel;orderLeaf.style.fontWeight='700';orderLeaf.style.paddingLeft='12px';}"
          new="""if(orderLeaf){
        orderLeaf.textContent='Panel '+panel;
        orderLeaf.style.fontWeight='700';
        orderLeaf.style.paddingLeft='12px';
        orderLeaf.style.display='inline-flex';
        orderLeaf.style.alignItems='center';
        orderLeaf.style.minWidth='0';
        const trashButton=[...card.querySelectorAll('button')].find(button=>button.textContent.trim()===''&&button.querySelector('svg'));
        if(trashButton&&trashButton.parentElement!==orderLeaf.parentElement){
          const titleRow=orderLeaf.parentElement;
          titleRow.style.display='flex';
          titleRow.style.alignItems='center';
          titleRow.style.justifyContent='space-between';
          titleRow.style.gap='8px';
          titleRow.style.paddingRight='8px';
          trashButton.style.margin='0';
          trashButton.style.padding='6px';
          trashButton.style.flex='0 0 auto';
          titleRow.appendChild(trashButton);
        }
      }"""
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add panelstock-client.js
          git diff --cached --quiet && exit 0
          git commit -m "Move CNC trash beside panel title"
          git push
