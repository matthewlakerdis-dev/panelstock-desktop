name: Final CNC sheet UI source patch
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CNC source
        run: echo '' | base64 -d > /tmp/fix_cnc.py && python /tmp/fix_cnc.py
      - name: Verify final structure
        run: grep -q 'function CncSheetGroups' index.html && grep -q 'Remove panel ' index.html && grep -q 'const open = expanded.has(sheet) ? expanded.get(sheet) : false' index.html
      - name: Commit source and remove temporary workflows
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git rm -f .github/workflows/move-cnc-trash-once.yml .github/workflows/fix-cnc-sheet-ui-final.yml || true; git add index.html; git commit -m 'Fix CNC sheet collapse and trash placement'; git push
