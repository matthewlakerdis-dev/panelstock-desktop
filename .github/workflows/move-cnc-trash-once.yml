name: Final CNC sheet UI source patch
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch CNC source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''        open && h("div", { className: "overflow-x-auto p-2", children: renderGroup(rows) })'''
          new='''        open && h("div", { className: "overflow-x-auto p-2", children: h(CncSheetGroups, { panels: rows, allPanels: total, renderGroup }) })'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'children: h(CncSheetGroups' not in s:
              raise SystemExit('order sheet hook not found')

          marker='''  function prepareCncBulkRows(order, lines) {'''
          component=r'''  function CncSheetGroups({ panels, allPanels, renderGroup }) {
    const [expanded, setExpanded] = useState(() => new Map());
    const groups = new Map();
    for (const panel of panels) {
      const sheet = String(panel.sheetNumber ?? "").trim();
      if (!groups.has(sheet)) groups.set(sheet, []);
      groups.get(sheet).push(panel);
    }
    const h = import_jsx_runtime.jsx;
    return h("div", { className: "space-y-2", children: Array.from(groups).sort(([a], [b]) => String(a).localeCompare(String(b), "en", { numeric: true, sensitivity: "base" })).map(([sheet, rows]) => {
      const open = expanded.has(sheet) ? expanded.get(sheet) : false;
      const total = allPanels.filter((p) => String(p.sheetNumber ?? "").trim() === sheet);
      const done = total.filter((p) => p.status === "completed").length;
      return h("section", { className: "bg-white border border-neutral-200 rounded-xl overflow-hidden", children: [
        h("button", { type: "button", "aria-expanded": open, onClick: () => setExpanded((previous) => { const next = new Map(previous); next.set(sheet, !open); return next; }), className: "w-full flex items-center justify-between gap-3 px-4 py-3 text-left bg-neutral-50 hover:bg-neutral-100", children: [
          h("span", { className: "min-w-0 break-words font-semibold text-sm text-neutral-800", children: "Sheet " + sheet }),
          h("span", { className: "shrink-0 text-xs text-neutral-500", children: (total.length - done) + " pending · " + done + "/" + total.length + " complete " + (open ? "▾" : "▸") })
        ] }),
        open && h("div", { className: "p-2", children: renderGroup(rows) })
      ] }, sheet);
    }) });
  }
'''
          if 'function CncSheetGroups(' not in s:
              s=s.replace(marker,component+marker,1)

          start='''/* @__PURE__ */ (0, import_jsx_runtime.jsx)(CncJobGroups, { panels: filtered, allPanels: cncPanels, query: q, renderGroup: (groupPanels) =>'''
          end='''    ] });
  }
  function OffcutModal'''
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0: raise SystemExit('CNC render block not found')
          replacement=r'''/* @__PURE__ */ (0, import_jsx_runtime.jsx)(CncJobGroups, { panels: filtered, allPanels: cncPanels, query: q, renderGroup: (groupPanels) => /* @__PURE__ */ (0, import_jsx_runtime.jsx)("div", { className: "space-y-2", children: groupPanels.map((p) => /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "bg-white rounded-xl border border-neutral-200 p-3", children: [
        /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "flex items-center justify-between gap-2", children: [
          /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "min-w-0 flex items-center gap-2 pl-3", children: [
            /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "text-sm font-bold text-neutral-800 truncate", children: ["Panel ", normalizeCncInput(p).panelNumber] }),
            isAdmin && /* @__PURE__ */ (0, import_jsx_runtime.jsx)("button", { type: "button", "aria-label": "Remove panel " + normalizeCncInput(p).panelNumber, className: "shrink-0 p-1 text-neutral-400 hover:text-red-700", onClick: () => { if (window.confirm("Remove this panel from the CNC schedule? This cannot be undone.")) onRemovePanel(p.id); }, children: /* @__PURE__ */ (0, import_jsx_runtime.jsx)(Trash2, { size: 15 }) })
          ] }),
          view === "pending" ? /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "flex flex-col gap-2 shrink-0", children: [
            /* @__PURE__ */ (0, import_jsx_runtime.jsx)("button", { onClick: () => setSheetToComplete({ orderNumber: p.orderNumber, sheetNumber: p.sheetNumber }), className: "text-xs font-semibold text-green-800 border border-green-700 rounded-lg px-3 py-2 hover:bg-green-50", children: "Complete sheet" }),
            /* @__PURE__ */ (0, import_jsx_runtime.jsx)("button", { onClick: () => setSheetToComplete({ orderNumber: p.orderNumber, sheetNumber: p.sheetNumber, panelId: p.id }), className: "shrink-0 bg-green-700 text-white text-xs font-bold px-3 py-2 rounded-lg", children: "Complete panel" })
          ] }) : /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "text-right shrink-0", children: [
            /* @__PURE__ */ (0, import_jsx_runtime.jsx)("div", { className: "text-xs font-semibold text-green-700", children: "Completed" }),
            /* @__PURE__ */ (0, import_jsx_runtime.jsx)("div", { className: "text-xs text-neutral-400", children: p.completedAt ? new Date(p.completedAt).toLocaleString() : "" })
          ] })
        ] }),
        p.status === "completed" && p.completedBy && /* @__PURE__ */ (0, import_jsx_runtime.jsxs)("div", { className: "mt-1.5 pt-1.5 border-t border-neutral-100 text-xs text-neutral-400 pl-3", children: ["Completed by ", p.completedBy] })
      ] }, p.id)) }) })
'''
          s=s[:a]+replacement+s[b:]
          p.write_text(s)
          PY
      - name: Verify final structure
        run: |
          grep -q 'function CncSheetGroups' index.html
          grep -q 'Remove panel ' index.html
          grep -q 'const open = expanded.has(sheet) ? expanded.get(sheet) : false' index.html
      - name: Commit source and remove temporary workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/move-cnc-trash-once.yml .github/workflows/fix-cnc-sheet-ui-final.yml || true
          git add index.html
          git commit -m 'Fix CNC sheet collapse and trash placement'
          git push
