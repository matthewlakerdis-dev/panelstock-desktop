name: Verify desktop release
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  fix_cnc:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop CNC source
        run: echo '' | base64 -d > /tmp/fix_cnc_desktop.py && python /tmp/fix_cnc_desktop.py
      - name: Commit desktop CNC fix
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git rm -f .github/workflows/move-cnc-trash-once.yml .github/workflows/fix-cnc-sheet-ui-final.yml || true; git add index.html; git diff --cached --quiet || (git commit -m 'Fix desktop CNC sheet collapse and trash placement' && git push)
