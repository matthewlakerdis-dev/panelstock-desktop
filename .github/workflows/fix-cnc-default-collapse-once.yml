name: Fix CNC collapsed sheet styling once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CNC sheet defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panelstock-client.js')
          s=p.read_text()
          s=s.replace("const collapsedCncSheets=new Set();\n  let cncEnhanceQueued=false;", "const collapsedCncSheets=new Set();\n  const initializedCncSheets=new Set();\n  let cncEnhanceQueued=false;")
          s=s.replace("if(orderLeaf){orderLeaf.textContent='Panel '+panel;orderLeaf.style.fontWeight='700';}", "if(orderLeaf){orderLeaf.textContent='Panel '+panel;orderLeaf.style.fontWeight='700';orderLeaf.style.paddingLeft='12px';}")
          s=s.replace("const right=document.createElement('span');right.style.cssText='color:#64748b;font-weight:600';\n        const update=()=>", "const right=document.createElement('span');right.style.cssText='color:#64748b;font-weight:600';\n        if(!initializedCncSheets.has(key)){collapsedCncSheets.add(key);initializedCncSheets.add(key);}\n        const update=()=>")
          p.write_text(s)
          PY
          rm .github/workflows/fix-cnc-default-collapse-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add panelstock-client.js .github/workflows/fix-cnc-default-collapse-once.yml
          git commit -m "Collapse CNC sheets by default and pad panel labels"
          git push
