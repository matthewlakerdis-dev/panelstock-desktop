name: Fix CNC hierarchy once
on:
  push:
    paths:
      - '.github/workflows/fix-cnc-hierarchy-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CNC hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panelstock-client.js')
          s=p.read_text()
          old="const leafElements=rootNode=>[...rootNode.querySelectorAll('div,span,p,strong')].filter(el=>el.children.length===0);"
          new="const leafElements=rootNode=>[...rootNode.querySelectorAll('*')].filter(el=>el.children.length===0&&el.textContent.trim());"
          if old not in s:
              raise SystemExit('expected selector not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-cnc-hierarchy-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add panelstock-client.js .github/workflows/fix-cnc-hierarchy-once.yml
          git commit -m "Fix CNC mobile hierarchy detection"
          git push
